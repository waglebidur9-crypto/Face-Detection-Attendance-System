{% extends "base.html" %}

{% block title %}Log Pre-Informed Leave - Attendance System{% endblock %}

{% block content %}
<div class="container py-4">
    <!-- Breadcrumb and Back Row -->
    <div class="row justify-content-center mb-3">
        <div class="col-lg-7 col-md-8 d-flex justify-content-between align-items-center">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="{{ url_for('students') }}" class="text-decoration-none fw-semibold">Students</a></li>
                    <li class="breadcrumb-item active text-muted" aria-current="page">Log Leave</li>
                </ol>
            </nav>
            <a href="{{ url_for('students') }}" class="btn btn-outline-secondary btn-sm shadow-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Directory
            </a>
        </div>
    </div>

    <!-- Form Container Card -->
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-8">
            <div class="card shadow border-0 rounded-4 overflow-hidden" style="background-color: var(--bs-body-bg);">
                
                <!-- Header Accent Band -->
                <div class="p-4 text-white position-relative" style="background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-white text-info p-3 rounded-3 fs-3 shadow-sm d-flex align-items-center justify-content-center" style="width: 56px; height: 56px;">
                            <i class="bi bi-calendar-check-fill"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-1 text-white">Log Pre-Informed Leave</h3>
                            <p class="text-white-50 small mb-0">Excused students will skip the 10:00 AM absent SMS alert.</p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{{ url_for('add_leave') }}" class="needs-validation" novalidate>
                        
                        <!-- Select Student -->
                        <div class="mb-3">
                            <label for="student_id" class="form-label fw-bold text-body">Select Student</label>
                            <div class="input-group shadow-sm rounded-2 overflow-hidden">
                                <span class="input-group-text bg-light text-primary border-0 px-3"><i class="bi bi-person-badge fs-5"></i></span>
                                <select class="form-select bg-light border-0 py-2.5 text-body" id="student_id" name="student_id" required>
                                    <option value="" disabled selected>Choose a student...</option>
                                    {% for student in students %}
                                        <option value="{{ student.student_id }}">
                                            {{ student.name }} (ID: {{ student.student_id }} - {{ student.department }})
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- Leave Date -->
                        <div class="mb-3">
                            <label for="leave_date" class="form-label fw-bold text-body">Leave Date</label>
                            <div class="input-group shadow-sm rounded-2 overflow-hidden">
                                <span class="input-group-text bg-light text-primary border-0 px-3"><i class="bi bi-calendar-event fs-5"></i></span>
                                <input type="date" class="form-control bg-light border-0 py-2.5 text-body" id="leave_date" name="leave_date" required>
                            </div>
                        </div>

                        <!-- Reason -->
                        <div class="mb-4">
                            <label for="reason" class="form-label fw-bold text-body">Reason for Absence</label>
                            <div class="input-group shadow-sm rounded-2 overflow-hidden">
                                <span class="input-group-text bg-light text-primary border-0 px-3"><i class="bi bi-chat-text fs-5"></i></span>
                                <textarea class="form-control bg-light border-0 py-2.5 text-body" id="reason" name="reason" rows="3" placeholder="e.g. Medical appointment, family event, etc."></textarea>
                            </div>
                        </div>

                        <hr class="my-4 text-muted opacity-25">

                        <div class="d-flex align-items-center justify-content-end gap-2">
                            <a href="{{ url_for('students') }}" class="btn btn-outline-secondary px-4 py-2 fw-semibold">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold shadow">
                                Save Leave Record <i class="bi bi-check-lg ms-1"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
