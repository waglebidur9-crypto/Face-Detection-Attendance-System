<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Attendance System{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-dark py-2">
        <div class="container-fluid px-4">
            <!-- Brand Logo with Glowing Icon -->
            <a class="navbar-brand d-flex align-items-center gap-2 text-info fw-bold fs-4" href="/dashboard">
                <i class="bi bi-person-bounding-box text-cyan icon-glow fs-3"></i>
                <span>Attendance Portal</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <!-- Navigation Links with Active Pill States -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2 ps-3">
                    <li class="nav-item">
                        <a class="nav-link custom-nav-link d-flex align-items-center gap-2 {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/dashboard">
                            <i class="bi bi-clock"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link custom-nav-link d-flex align-items-center gap-2 {% if request.endpoint == 'recognize' %}active{% endif %}" href="/recognize">
                            <i class="bi bi-camera"></i> Live Terminal
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link custom-nav-link d-flex align-items-center gap-2 {% if request.endpoint in ['students', 'add_student', 'edit_student'] %}active{% endif %}" href="/students">
                            <i class="bi bi-people"></i> Students
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link custom-nav-link d-flex align-items-center gap-2 {% if request.endpoint == 'attendance' %}active{% endif %}" href="/attendance">
                            <i class="bi bi-calendar-event"></i> Daily Attendance
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link custom-nav-link d-flex align-items-center gap-2 {% if request.endpoint == 'reports' %}active{% endif %}" href="/reports">
                            <i class="bi bi-bar-chart"></i> Reports
                        </a>
                    </li>
                </ul>

                <!-- Right Controls: User Profile & Logout -->
                <div class="d-flex align-items-center gap-3">
                    <span class="text-secondary small d-flex align-items-center gap-1">
                        <i class="bi bi-person-circle text-info fs-5"></i> Logged in as: 
                        <strong class="text-white">{{ session.get('user', 'admin') }}</strong>
                    </span>
                    <a href="/logout" class="btn btn-outline-danger btn-sm px-3 rounded-pill d-flex align-items-center gap-1">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container-fluid py-4 px-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
