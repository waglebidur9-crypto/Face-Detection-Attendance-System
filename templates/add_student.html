<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Attendance System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Dark Theme CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg px-4 border-bottom border-secondary">
        <a class="navbar-brand fw-bold text-info" href="{{ url_for('dashboard') }}">⚡ Attendance System</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <!-- Theme Toggle Button -->
            <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm px-2 py-1 rounded-circle d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;" title="Toggle Theme" onclick="toggleTheme()">
                <i id="themeIcon" class="bi bi-sun-fill fs-6 text-warning"></i>
            </button>
            <a href="{{ url_for('students') }}" class="btn btn-outline-secondary btn-sm">Back to Students</a>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container mt-5">
        
        <!-- Consistent Page Header Section -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <h2 class="fw-bold mb-1">Add New Student</h2>
                <p class="text-muted mb-0">Register a new student record into the system database.</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card p-4 shadow-sm bg-body-tertiary">

                    <!-- Flash Messages / Error Handler -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <!-- Add Student Form -->
                    <form method="POST" action="{{ url_for('add_student') }}">
                        <div class="mb-3">
                            <label for="student_id" class="form-label">Student ID</label>
                            <input type="text" class="form-control" id="student_id" name="student_id" value="{{ student_id|default('') }}" placeholder="e.g. STU-1024" required>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ name|default('') }}" placeholder="e.g. Jane Doe" required>
                        </div>

                        <div class="mb-4">
                            <label for="department" class="form-label">Department</label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="" disabled selected>Select Department</option>
                                <option value="BCA" {% if department == 'BCA' %}selected{% endif %}>BCA</option>
                                <option value="BSc.CSIT" {% if department == 'BSc.CSIT' %}selected{% endif %}>BSc.CSIT</option>
                                <option value="BIM" {% if department == 'BIM' %}selected{% endif %}>BIM</option>
                                <option value="BBIT" {% if department == 'BBIT' %}selected{% endif %}>BBIT</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Save & Continue</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Theme Toggle Script -->
    <script>
        function toggleTheme() {
            const htmlTag = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const currentTheme = htmlTag.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            htmlTag.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            if (newTheme === 'dark') {
                themeIcon.className = 'bi bi-sun-fill fs-6 text-warning';
            } else {
                themeIcon.className = 'bi bi-moon-fill fs-6';
            }
        }

        // Apply saved theme on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            const htmlTag = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            htmlTag.setAttribute('data-bs-theme', savedTheme);
            if (savedTheme === 'dark') {
                themeIcon.className = 'bi bi-sun-fill fs-6 text-warning';
            } else {
                themeIcon.className = 'bi bi-moon-fill fs-6';
            }
        });
    </script>
</body>
</html>
