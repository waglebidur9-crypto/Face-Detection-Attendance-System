<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Attendance System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Dark Theme CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4">
        <a class="navbar-brand fw-bold text-info" href="{{ url_for('dashboard') }}">⚡ Attendance System</a>
        <div class="ms-auto">
            <a href="{{ url_for('students') }}" class="btn btn-outline-secondary btn-sm">Back to Students</a>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card-custom">
                    <h3 class="text-info mb-4">Add New Student</h3>

                    <!-- Flash Messages / Error Handler (Displays duplicate ID warnings) -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <!-- Add Student Form -->
                    <form method="POST" action="{{ url_for('add_student') }}">
                        <div class="mb-3">
                            <label for="student_id" class="form-label">Student ID</label>
                            <input type="text" class="form-control" id="student_id" name="student_id" value="{{ student_id|default('') }}" placeholder="e.g. STU-1024" required>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ name|default('') }}" placeholder="e.g. Jane Doe" required>
                        </div>

                        <div class="mb-4">
                            <label for="department" class="form-label">Department</label>
                            <select class="form-control" id="department" name="department" required>
                                <option value="" disabled selected>Select Department</option>
                                <option value="BCA" {% if department == 'BCA' %}selected{% endif %}>BCA</option>
                                <option value="BSc.CSIT" {% if department == 'BSc.CSIT' %}selected{% endif %}>BSc.CSIT</option>
                                <option value="BIM" {% if department == 'BIM' %}selected{% endif %}>BIM</option>
                                <option value="BBIT" {% if department == 'BBIT' %}selected{% endif %}>BBIT</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-info-glow px-4">Save & Continue</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle for dismissible alerts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
