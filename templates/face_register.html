{% extends "base.html" %}
{% block title %}Register Face{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="m-0 font-weight-bold text-white">Register Face for ID: <span class="text-info">{{ student_id }}</span></h4>
        <a href="/students" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Back to Roster
        </a>
    </div>

    <div class="row">
        <!-- Wide Camera Column -->
        <div class="col-lg-8 mb-4">
            <div class="card-custom text-center p-3 h-100 d-flex flex-column justify-content-center align-items-center">
                <div class="position-relative w-100" style="max-width: 900px;">
                    <video id="webcam" autoplay playsinline class="w-100 rounded border border-secondary shadow-lg" style="transform: scaleX(-1); max-height: 500px; object-fit: cover;"></video>
                </div>
                
                <div class="mt-4">
                    <button id="capture-btn" class="btn btn-info fw-bold px-5 py-2 fs-5">
                        <i class="bi bi-camera-fill me-2"></i> Capture & Save Face
                    </button>
                </div>
            </div>
        </div>

        <!-- Live Terminal Log Column -->
        <div class="col-lg-4 mb-4">
            <div class="card bg-black border border-secondary rounded p-3 h-100 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-2 mb-2">
                    <span class="text-secondary font-monospace small"><i class="bi bi-terminal-fill me-1"></i> terminal://register</span>
                    <span class="badge bg-dark text-success font-monospace" id="terminal-status">IDLE</span>
                </div>
                <div id="terminal-logs" class="font-monospace text-success small overflow-auto flex-grow-1" style="min-height: 350px; text-align: left; background-color: #000; padding: 5px;">
                    [SYSTEM] Initialized registration terminal for ID: <span class="text-info">{{ student_id }}</span><br>
                    [SYSTEM] Requesting video feed access...<br>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const studentId = "{{ student_id }}";
    const video = document.getElementById('webcam');
    const captureBtn = document.getElementById('capture-btn');
    const terminalLogs = document.getElementById('terminal-logs');
    const terminalStatus = document.getElementById('terminal-status');

    function logToTerminal(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        let colorClass = 'text-success';
        if (type === 'error') colorClass = 'text-danger';
        if (type === 'warn') colorClass = 'text-warning';
        if (type === 'sys') colorClass = 'text-info';

        terminalLogs.innerHTML += `<span class="text-secondary">[${timestamp}]</span> <span class="${colorClass}">${message}</span><br>`;
        terminalLogs.scrollTop = terminalLogs.scrollHeight;
    }

    // Access Webcam
    navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } } })
        .then(s => {
            video.srcObject = s;
            logToTerminal("Wide webcam stream successfully connected.", "sys");
        })
        .catch(err => {
            logToTerminal("Camera permission denied or error: " + err, "error");
            terminalStatus.innerText = "ERROR";
            terminalStatus.className = "badge bg-dark text-danger font-monospace";
        });

    captureBtn.addEventListener('click', async () => {
        captureBtn.disabled = true;
        terminalStatus.innerText = "PROCESSING";
        terminalStatus.className = "badge bg-dark text-warning font-monospace";
        
        logToTerminal("Capturing frame from video stream...", "sys");

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        logToTerminal("Transmitting payload to /api/register_face...", "sys");

        try {
            const response = await fetch('/api/register_face', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ student_id: studentId, image: canvas.toDataURL('image/jpeg') })
            });
            const result = await response.json();

            if (result.success) {
                logToTerminal("[SUCCESS] " + result.message, "success");
                terminalStatus.innerText = "SUCCESS";
                terminalStatus.className = "badge bg-dark text-success font-monospace";
                setTimeout(() => {
                    window.location.href = "/students";
                }, 2000);
            } else {
                logToTerminal("[ERROR] " + result.message, "error");
                terminalStatus.innerText = "FAILED";
                terminalStatus.className = "badge bg-dark text-danger font-monospace";
                captureBtn.disabled = false;
            }
        } catch (err) {
            logToTerminal("[CRITICAL] Network exception: " + err, "error");
            terminalStatus.innerText = "ERROR";
            terminalStatus.className = "badge bg-dark text-danger font-monospace";
            captureBtn.disabled = false;
        }
    });
</script>
{% endblock %}
