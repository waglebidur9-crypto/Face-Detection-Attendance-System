{% extends "base.html" %}
{% block content %}
<h2>Register Face for ID: {{ student_id }}</h2>
<div class="mt-3">
    <video id="webcam" autoplay playsinline width="400" height="300" class="border"></video>
    <br>
    <button id="capture-btn" class="btn btn-success mt-2">Capture & Save Face</button>
    <div id="msg" class="mt-2"></div>
</div>
<script>
const video = document.getElementById('webcam');
navigator.mediaDevices.getUserMedia({ video: true }).then(s => video.srcObject = s);

document.getElementById('capture-btn').addEventListener('click', async () => {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    const response = await fetch('/api/register_face', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ student_id: "{{ student_id }}", image: canvas.toDataURL('image/jpeg') })
    });
    const result = await response.json();
    document.getElementById('msg').innerHTML = `<span class="text-${result.success ? 'success' : 'danger'}">${result.message}</span>`;
});
</script>
{% endblock %}
