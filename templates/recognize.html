<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Recognition - Attendance System</title>
    
    <!-- Flash-prevention script for dark mode -->

        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Unified Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Video Kiosk Container */
        .video-container {
            position: relative;
            display: inline-block;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--bs-border-color);
            background-color: #0b0f19;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .card-custom {
            background-color: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="bg-body-tertiary">

    <div class="app-wrapper min-vh-100 d-flex flex-column">
        
        <!-- Persistent Top Navbar with Integrated Navigation -->
        <header class="navbar navbar-expand-lg bg-body border-bottom sticky-top shadow-sm px-3 px-lg-4 py-2">
            <div class="container-fluid">
                <!-- Brand / Logo -->
                <a class="navbar-brand d-flex align-items-center gap-2 me-4" href="{{ url_for('dashboard') }}">
                    <i class="bi bi-mortarboard-fill text-primary fs-5"></i>
                    <span class="fw-bold fs-6">Attendance System</span>
                </a>

                <!-- Mobile Toggle Button -->
                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#topNavbarNav" aria-controls="topNavbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navigation Links & Right Utility Group -->
                <div class="collapse navbar-collapse justify-content-between" id="topNavbarNav">
                    
                    <!-- Navigation Links -->
                    <ul class="navbar-nav align-items-lg-center gap-1 gap-lg-2 my-2 my-lg-0">
                        <li class="nav-item">
                            <a class="nav-link px-3 py-2 rounded-2 fw-semibold {% if request.endpoint == 'dashboard' %}active text-primary bg-primary-subtle{% endif %}" href="{{ url_for('dashboard') }}">
                                <i class="bi bi-grid-1x2-fill me-1"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3 py-2 rounded-2 fw-semibold {% if request.endpoint in ['students', 'add_student', 'edit_student'] %}active text-primary bg-primary-subtle{% endif %}" href="{{ url_for('students') }}">
                                <i class="bi bi-people me-1"></i> Students
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3 py-2 rounded-2 fw-semibold {% if request.endpoint == 'attendance' %}active text-primary bg-primary-subtle{% endif %}" href="{{ url_for('attendance') }}">
                                <i class="bi bi-calendar-check me-1"></i> Attendance
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3 py-2 rounded-2 fw-semibold {% if request.endpoint == 'reports' %}active text-primary bg-primary-subtle{% endif %}" href="{{ url_for('reports') }}">
                                <i class="bi bi-bar-chart-line me-1"></i> Reports
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3 py-2 rounded-2 fw-semibold {% if request.endpoint == 'recognize' %}active text-primary bg-primary-subtle{% endif %}" href="{{ url_for('recognize') }}">
                                <i class="bi bi-camera-video-fill me-1"></i> Live Kiosk
                            </a>
                        </li>
                    </ul>

                    <!-- Right Group: Theme Toggle, Profile & Logout / Back Action -->
                    <div class="navbar-nav align-items-lg-center gap-3 ms-auto pt-2 pt-lg-0 border-top border-lg-0 mt-2 mt-lg-0">
                        <div class="d-flex align-items-center gap-3">
                            <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm px-2 py-1 rounded-circle" title="Toggle Theme" onclick="toggleTheme()">
                                <i id="themeIcon" class="bi bi-moon-fill fs-6"></i>
                            </button>

                            <div class="user-profile-badge d-flex align-items-center gap-2">
                                <i class="bi bi-person-circle fs-5 text-secondary"></i>
                                <span class="fw-semibold small">Admin</span>
                            </div>
                            
                            <div class="vr h-50 my-auto d-none d-lg-block bg-slate-300"></div>
                            
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm px-3 fw-semibold">
                                <i class="bi bi-arrow-left me-1"></i> Dashboard
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </header>

        <!-- Main Content Body Wrapper -->
        <main class="container-fluid px-3 px-md-5 py-4 flex-grow-1">
            
            <!-- Page Header -->
            <div class="mb-4 text-center text-md-start">
                <h2 class="fw-bold mb-1">Live Face Recognition Kiosk</h2>
                <p class="text-muted small mb-0">Position your face clearly inside the frame to mark automatic attendance.</p>
            </div>

            <!-- Recognition Center Card -->
            <div class="row justify-content-center">
                <div class="col-lg-8 text-center">
                    <div class="card-custom">
                        
                        <!-- Video Feed Container -->
                        <div class="video-container mb-3">
                            <video id="video" autoplay playsinline width="640" height="480"></video>
                            <canvas id="canvas" class="d-none"></canvas>
                        </div>

                        <!-- Live Status Alert Box -->
                        <div id="status-alert" class="alert alert-info py-2 px-3 fw-semibold mb-0 shadow-sm" role="alert">
                            <i class="bi bi-info-circle-fill me-1"></i> Initializing Camera...
                        </div>

                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Theme Toggle Handler Scripts -->
    <script>
        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (icon) {
                if (theme === 'dark') {
                    icon.className = 'bi bi-sun-fill fs-6 text-warning';
                } else {
                    icon.className = 'bi bi-moon-fill fs-6';
                }
            }
        }

        // Initialize icon state on page load
        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
            updateThemeIcon(currentTheme);
        });

        function toggleTheme() {
            const htmlEl = document.documentElement;
            const currentTheme = htmlEl.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            htmlEl.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }
    </script>

    <!-- Face Recognition & Camera Logic Script -->
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusAlert = document.getElementById('status-alert');

        let recognitionStreak = {};
        const requiredStreak = 5; // Requires ~2 seconds of stable presence
        let isProcessing = false;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                statusAlert.className = "alert alert-info py-2 px-3 fw-semibold mb-0 shadow-sm";
                statusAlert.innerHTML = '<i class="bi bi-camera-fill me-1"></i> System Ready. Looking for faces...';
            } catch (err) {
                console.error("Camera access error:", err);
                statusAlert.className = "alert alert-danger py-2 px-3 fw-semibold mb-0 shadow-sm";
                statusAlert.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> Error: Webcam access denied.';
            }
        }

        function captureFrameAsBase64() {
            if (video.videoWidth === 0 || video.videoHeight === 0) return null;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.85);
        }

        async function processVideoFrame() {
            if (isProcessing || video.paused || video.ended) return;

            const imageBlob = captureFrameAsBase64();
            if (!imageBlob) return;

            isProcessing = true;

            try {
                let response = await fetch('/api/process_frame', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageBlob })
                });

                let data = await response.json();

                if (data.status === "success" && data.faces && data.faces.length > 0) {
                    let face = data.faces[0];
                   
                    if (face.student_id) {
                        let studentId = face.student_id;
                        recognitionStreak[studentId] = (recognitionStreak[studentId] || 0) + 1;

                        if (recognitionStreak[studentId] < requiredStreak) {
                            statusAlert.className = "alert alert-warning py-2 px-3 fw-semibold mb-0 shadow-sm";
                            statusAlert.innerHTML = `<i class="bi bi-hourglass-split me-1"></i> Verifying ${face.name}... Hold steady (${recognitionStreak[studentId]}/${requiredStreak})`;
                        } else if (recognitionStreak[studentId] === requiredStreak) {
                            let markRes = await fetch('/api/mark_attendance', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    student_id: studentId,
                                    confidence: face.score
                                })
                            });
                            let markData = await markRes.json();

                            statusAlert.className = `alert ${markData.success ? 'alert-success' : 'alert-warning'} py-2 px-3 fw-semibold mb-0 shadow-sm`;
                            statusAlert.innerHTML = `<i class="bi ${markData.success ? 'bi-check-circle-fill' : 'bi-exclamation-circle-fill'} me-1"></i> ${face.name} (ID: ${studentId}) - ${markData.message}`;
                            
                            setTimeout(() => { recognitionStreak[studentId] = 0; }, 5000);
                        }
                    } else {
                        recognitionStreak = {};
                        statusAlert.className = "alert alert-secondary py-2 px-3 fw-semibold mb-0 shadow-sm";
                        statusAlert.innerHTML = '<i class="bi bi-person-slash me-1"></i> Unrecognized Face Detected';
                    }
                } else {
                    recognitionStreak = {};
                    statusAlert.className = "alert alert-info py-2 px-3 fw-semibold mb-0 shadow-sm";
                    statusAlert.innerHTML = '<i class="bi bi-search me-1"></i> Looking for faces...';
                }
            } catch (err) {
                console.error("Communication error:", err);
            } finally {
                isProcessing = false;
            }
        }

        startCamera();
        setInterval(processVideoFrame, 400);
    </script>
</body>
</html>
